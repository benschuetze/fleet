name: CI

on:
  # PRs run the lean set on Ubuntu (the required checks); main, release tags, a manual run and the label
  # "ci:full" on a PR run the full matrix on Linux, macOS and Windows.
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A new push to a PR replaces its run; on main every merge gets its full run.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    # Decides the matrix and whether there is code at all. A PR that changes only docs/ and Markdown still
    # reports every required check, as green with its steps skipped, so it never hangs on "pending".
    name: Plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.plan.outputs.code }}
      os: ${{ steps.plan.outputs.os }}
      runtime: ${{ steps.plan.outputs.runtime }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          FULL_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'ci:full') }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          code=true
          if [ "$EVENT" = pull_request ]; then
            # Fail closed: a diff that does not work runs everything. --no-renames: code moved into docs/ is code.
            if files=$(git diff --no-renames --name-only "$BASE...$HEAD") && [ -n "$files" ] &&
              ! printf '%s\n' "$files" | grep -qvE '^docs/|\.md$'; then code=false; fi
          fi
          if [ "$EVENT" != pull_request ] || [ "$FULL_LABEL" = true ]; then
            os='["ubuntu-latest","macos-latest","windows-latest"]'
            runtime='[{"os":"ubuntu-latest","node":18},{"os":"ubuntu-latest","node":22},{"os":"ubuntu-latest","node":24},{"os":"macos-latest","node":24},{"os":"windows-latest","node":18},{"os":"windows-latest","node":24}]'
          else
            os='["ubuntu-latest"]'
            runtime='[{"os":"ubuntu-latest","node":18},{"os":"ubuntu-latest","node":24}]'
          fi
          { echo "code=$code"; echo "os=$os"; echo "runtime=$runtime"; } >> "$GITHUB_OUTPUT"
          echo "code=$code os=$os"

  check:
    name: Types, lint, unit tests (${{ matrix.os }})
    needs: plan
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.plan.outputs.os) }}
    env:
      CODE: ${{ needs.plan.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.CODE == 'true'
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: env.CODE == 'true'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: env.CODE == 'true'
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: env.CODE == 'true'
      - run: pnpm typecheck
        if: env.CODE == 'true'
      - run: pnpm lint
        if: env.CODE == 'true'
      - run: pnpm test
        if: env.CODE == 'true'
      - if: env.CODE == 'true' && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: |
            dist/
            build/client/
            scripts/smoke.mjs
            package.json
          retention-days: 3

  runtime:
    # Deliberately without "pnpm install": the built release must run on Node built-ins alone.
    # If the bundle needed anything from node_modules, this job fails.
    name: Runtime without dependencies (${{ matrix.os }}, Node ${{ matrix.node }})
    needs: [plan, check]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.runtime) }}
    env:
      CODE: ${{ needs.plan.outputs.code }}
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        if: env.CODE == 'true'
        with:
          name: release
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: env.CODE == 'true'
        with:
          node-version: ${{ matrix.node }}
      - run: node scripts/smoke.mjs
        if: env.CODE == 'true'

  e2e:
    name: E2E and accessibility
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CODE: ${{ needs.plan.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.CODE == 'true'
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: env.CODE == 'true'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: env.CODE == 'true'
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: env.CODE == 'true'
      - run: pnpm build
        if: env.CODE == 'true'
      - run: pnpm exec playwright install --with-deps chromium
        if: env.CODE == 'true'
      - run: pnpm test:e2e
        if: env.CODE == 'true'
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
